# Netlify build settings for the Next.js site. These override the settings in
# the Netlify UI, which were configured for the previous Vite site (publish
# directory "dist"). Netlify detects Next.js and applies its Next.js runtime
# automatically.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 requires Node.js >= 20.9
  NODE_VERSION = "22"
